name: CMake on multiple platforms

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: linux-latest
    container: devkitpro/devkitarm:latest
    
    steps:
    - uses: actions/checkout@v4
    - name: cmake configure
      run: |
        echo "'dkp-pacman -Slq | dkp-pacman -Syu - --noconfirm' skipped"
        git config --global --add safe.directory /__w/dolphin-new3ds/dolphin-new3ds
        cmake . -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake
    - name: compile
      run: |
        make && echo "SUCCESS!!!!!"; echo done;
    - name: Upload dolphin n3ds
      uses: svenstaro/upload-release-action@v2
      with:
        file: thing.cia
        tag: Latest
        asset_name: dist.7z
        overwrite: true
